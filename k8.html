<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài K8 - Tính Chỉ Số BMI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <a href="42.html" class="back-btn">&larr; Về trang chủ</a>
        <h2>Bài K8: Tính Chỉ Số BMI</h2>
        
        <div style="margin: 15px 0; text-align: left; max-width: 250px; margin-left: auto; margin-right: auto;">
            <label>Cân nặng (kg):</label><br>
            <input type="number" id="weight" step="0.1" placeholder="Ví dụ: 65" style="width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #475569; background:#0f172a; color:white;"><br><br>
            
            <label>Chiều cao (m):</label><br>
            <input type="number" id="height" step="0.01" placeholder="Ví dụ: 1.70" style="width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #475569; background:#0f172a; color:white;">
        </div>

        <button onclick="calculateBMI()" class="btn">Tính BMI</button>
        <div id="bmi-result" class="output-box">Kết quả hiển thị ở đây</div>
    </div>

    <script>
        function calculateBMI() {
            const w = parseFloat(document.getElementById('weight').value);
            const h = parseFloat(document.getElementById('height').value);
            const res = document.getElementById('bmi-result');

            if (!w || !h || w <= 0 || h <= 0) {
                res.textContent = 'Vui lòng nhập cân nặng và chiều cao hợp lệ!';
                return;
            }

            const bmi = w / (h * h);
            let category = '';

            if (bmi < 18.5) {
                category = 'Thiếu cân';
            } else if (bmi < 25) {
                category = 'Bình thường';
            } else if (bmi < 30) {
                category = 'Thừa cân';
            } else {
                category = 'Béo phì';
            }

            res.innerHTML = `BMI: <b>${bmi.toFixed(2)}</b> - Phân loại: <span style="color:#facc15">${category}</span>`;
        }
    </script>
</body>
</html>
