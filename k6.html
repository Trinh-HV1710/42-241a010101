<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài K6 - Xử Lý Sự Kiện Bàn Phím</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body tabindex="0" style="outline: none;">
    <div class="container">
        <a href="42.html" class="back-btn">&larr; Về trang chủ</a>
        <h2>Bài K6: Sự Kiện Bàn Phím (Lên / Xuống)</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-top: 5px;">(Click vào vùng màn hình tối bên dưới và dùng phím mũi tên Lên/Xuống)</p>
        
        <div style="height: 250px; position: relative; background: #020617; border: 1px solid #38bdf8; border-radius: 8px; margin-top: 15px; overflow: hidden;">
            <div id="moving-box" style="width: 50px; height: 50px; background: #ef4444; position: absolute; top: 100px; left: calc(50% - 25px); border-radius: 50%; transition: top 0.05s linear;"></div>
        </div>
    </div>

    <script>
        const box = document.getElementById('moving-box');
        let currentTop = 100;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentTop = Math.max(0, currentTop - 15);
                box.style.top = currentTop + 'px';
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentTop = Math.min(200, currentTop + 15);
                box.style.top = currentTop + 'px';
            }
        });
    </script>
</body>
</html>
